        - heading "My mission is to help you heal, choose better, and love well." [level=2] [ref=e931]
      - generic [ref=e35]:
        - paragraph [ref=e36]: I became a counselor because I believe that most of the pain people carry in their relationships did not begin there - it began long before, in their first homes, in childhoods, in the patterns they watched and inherited and never had the right language for.
        - paragraph [ref=e37]: My work is to help you find that language; to name what has been driving the patterns; to heal what needs healing, and to build a life and relationships that actually feel like yours.
        - button "Read my full story" [ref=e932] [cursor=pointer]
